global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104

  - job_name: milvus
    metrics_path: /metrics
    static_configs:
      - targets:
          - milvus:9091

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://ragent-api:8000/api/health
          - http://frontend/
          - http://frontend/api/health
          - http://ops-test-service/
          - http://rustfs:9000/minio/health/live
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: ragent-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - ragent-api:8000


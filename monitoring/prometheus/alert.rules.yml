groups:
  - name: ragent-availability
    rules:
      - alert: RagentTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "采集目标不可用"
          description: "{{ $labels.job }} / {{ $labels.instance }} 已不可用超过 1 分钟"

      - alert: RagentHttpProbeFailed
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 服务探测失败"
          description: "{{ $labels.instance }} 探测失败超过 1 分钟"

      - alert: RagentHighCpuUsage
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率偏高"
          description: "节点 CPU 使用率连续 5 分钟超过 85%"

      - alert: RagentHighMemoryUsage
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率偏高"
          description: "节点内存使用率连续 5 分钟超过 90%"

      - alert: RagentRedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可用"
          description: "Redis exporter 无法采集 Redis 指标"

      - alert: RagentMysqlDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 不可用"
          description: "MySQL exporter 无法采集 MySQL 指标"
